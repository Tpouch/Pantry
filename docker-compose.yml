services:
  pantry:
    build:
      context: .
      dockerfile: Dockerfile
    develop:
      watch:
        - action: rebuild
          path: ./server
        - action: rebuild
          path: ./client
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./Dockerfile
    ports:
      - "3004:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      SITE_PASSWORD: ${SITE_PASSWORD:-demo123}
    restart: unless-stopped